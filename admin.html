<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Blue Logistic | Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="center"><div class="panel login"><h1>SKY BLUE LOGISTIC</h1><p>Admin Dashboard</p><form id="loginForm"><input id="user" placeholder="Username" value="admin" required><input id="pass" type="password" placeholder="Password" required><button>Sign in</button><div id="loginErr"></div></form><small>Default demo password: ChangeMe123!</small></div></div><div id="app" hidden><header><div class="bar"><b>SKY BLUE LOGISTIC</b><div><a href="/" target="_blank">Public Tracking</a><button id="logout">Logout</button></div></div></header><main><div class="top"><div><h1>Shipment Management</h1><p>Create, edit and update tracking records.</p></div><button class="primary" id="newBtn">+ New Shipment</button></div><div id="stats" class="stats"></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Tracking</th><th>Status</th><th>Route</th><th>Current</th><th>ETA</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><div id="modal" class="modal" hidden><div class="panel modalbox"><div class="modalhead"><h2 id="modalTitle">New Shipment</h2><button id="close">×</button></div><form id="shipForm"><input type="hidden" id="original"><div class="grid"><label>Tracking number<input id="fTracking" required></label><label>Status<select id="fStatus"><option>Shipment Created</option><option>Picked Up</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option><option>Delayed</option></select></label><label>Origin<input id="fOrigin" required></label><label>Destination<input id="fDestination" required></label><label>Current location<input id="fCurrent"></label><label>Estimated delivery<input id="fEta" type="date"></label><label>Service<input id="fService" value="International Express"></label><label>Customer name<input id="fCustomer"></label><label>Customer email<input id="fEmail" type="email"></label><label>Package type<input id="fPackage"></label><label>Weight<input id="fWeight"></label></div><h3>Tracking event</h3><div class="eventgrid"><input id="eStatus" placeholder="Event status e.g. In Transit"><input id="eLocation" placeholder="Location"><input id="eNote" placeholder="Note"><input id="eDate" type="datetime-local"></div><button type="button" id="addEvent">Add event</button><div id="eventsList"></div><button class="primary save" type="submit">Save shipment</button></form></div></div><script src="admin.js"></script></body></html>
